[package]
name = "chirpy"
version = "0.1.0"
description = "Chat — wallet-native chat for any community"
authors = ["Bittrees Technology"]
edition = "2021"
rust-version = "1.90"

[lib]
# The shared library that both the desktop binary and the mobile entrypoints use.
name = "chirpy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deep linking lets external flows like WalletConnect return to the native app.
tauri-plugin-deep-link = "2"

# Auto-update is a desktop-only feature (iOS/Android update via their app stores),
# so the updater + process plugins are gated to non-mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Upstream ZIP 9 security fix; return to a published release once it includes this commit.
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "ba98bfadc4c868c9a7e1a226c83af528e1f11b89" }
tauri-plugin-process = "2"
