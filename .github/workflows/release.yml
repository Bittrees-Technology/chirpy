name: release

# Tag a release to validate, build and sign draft desktop artifacts + updater manifest.
#   git tag app-v0.1.1 && git push origin app-v0.1.1
# The app's updater polls the published latest.json and self-updates.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

jobs:
  # The local workflow checks this release revision without signing secrets.
  prerequisites:
    permissions:
      contents: read
    uses: ./.github/workflows/release-checks.yml
  release:
    needs: prerequisites
    timeout-minutes: 60
    env:
      VITE_TRANSPORT: xmtp
      VITE_XMTP_ENV: production
      VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN || 'https://chirpy.bittrees.org' }}
      VITE_MAINNET_RPC_URL: ${{ vars.VITE_MAINNET_RPC_URL }}
      VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
      CHIRPY_GATE_HEALTH_URL: ${{ vars.CHIRPY_GATE_HEALTH_URL }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential libssl-dev

      # Read the pnpm version from package.json's `packageManager` field — do NOT
      # also pass a `version:` here. Specifying both makes pnpm/action-setup@v4
      # abort with "Multiple versions of pnpm specified" (the tag `version: 10`
      # never matched `pnpm@10.32.1`), which failed every release before it could
      # even install dependencies. `packageManager` is the single source of truth,
      # matching test.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require release configuration and live readiness
        run: node scripts/validate-native-release.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS bundle needs both architecture targets. Linux and
          # Windows build their runner-native targets and do not need extras.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sign draft artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (set in repo Settings → Secrets and variables → Actions):
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing + notarization (macOS only; ignored elsewhere). When these secrets are
          # set the macOS build is codesigned and notarized. Missing values fail preflight.
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: apps/web
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Chirpy ${{ github.ref_name }}"
          releaseBody: "Draft artifacts for signature, installation, updater and platform acceptance. Do not publish until the production readiness checklist is complete."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
