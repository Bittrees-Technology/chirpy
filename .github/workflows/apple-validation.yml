name: apple-validation

# Credential-free validation of the macOS/iOS (Tauri) build surface. These jobs
# compile the native shell and exercise an unsigned iOS simulator application.
# They do not sign/notarize or publish release artifacts — that path (Apple Developer ID + the
# release workflow) requires secrets and stays in the tag-triggered release.yml.
#
# Runs on macOS runners (needed for the Apple targets), so it is scoped with
# `paths:` to only fire when the Apple build surface actually changes.
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/apple-validation.yml"
      - "scripts/test-ios-simulator.py"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/apple-validation.yml"
      - "scripts/test-ios-simulator.py"
  workflow_dispatch:

concurrency:
  group: apple-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tauri-check:
    name: macOS Tauri check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's `packageManager` field — never also
      # pass `version:` (that combination aborts pnpm/action-setup@v4). See release.yml.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both arches, so the universal-apple-darwin release bundle is validated.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri --version
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo check --manifest-path apps/web/src-tauri/Cargo.toml --target aarch64-apple-darwin
      - run: cargo check --manifest-path apps/web/src-tauri/Cargo.toml --target x86_64-apple-darwin

  ios-config-check:
    name: iOS config check
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Simulator compilation exercises the actual iOS cfg without requiring
          # a signing identity, provisioning profile, or physical device.
          targets: aarch64-apple-ios-sim
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri --version
      - run: pnpm typecheck
      # Guards the deep-link / WalletConnect return config (chirpy:// scheme,
      # deep-link:default capability, WC metadata.redirect) against drift.
      - run: pnpm test
      # The archive build below compiles the actual simulator target. macOS
      # compilation is covered by the separate dual-architecture job above.
      - name: Generate the iOS Xcode project
        run: pnpm tauri ios init --ci --skip-targets-install
      - name: Build unsigned iOS simulator archive
        env:
          VITE_TRANSPORT: xmtp
          VITE_XMTP_ENV: dev
          VITE_API_ORIGIN: https://example.invalid
        run: pnpm tauri ios build --ci --debug --target aarch64-sim --no-sign --archive-only
      - name: Inspect generated simulator archives
        run: |
          python3 - <<'PYIOS'
          from pathlib import Path
          import plistlib
          apps = list(Path('apps/web/src-tauri/gen/apple').rglob('*.xcarchive/Products/Applications/*.app'))
          assert apps, 'No archived simulator application was generated'
          for app in apps:
              with (app / 'Info.plist').open('rb') as source:
                  info = plistlib.load(source)
              assert info['CFBundleIdentifier'] == 'org.bittrees.chirpy'
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneSimulator']
              schemes = [scheme for item in info.get('CFBundleURLTypes', []) for scheme in item.get('CFBundleURLSchemes', [])]
              assert 'chirpy' in schemes, 'Wallet return scheme is absent from the built application'
              assert (app / info['CFBundleExecutable']).is_file()
              print(f'Validated unsigned simulator application: {app}')
          PYIOS
      - name: Install and launch the simulator app
        run: python3 scripts/test-ios-simulator.py
      - name: Upload simulator screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke
          path: test-results/ios-simulator/
          if-no-files-found: error
          retention-days: 7
