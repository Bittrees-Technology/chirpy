name: production-availability
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-availability
  cancel-in-progress: false
jobs:
  public-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check public Chat and Mail availability
        run: node scripts/production-availability.mjs
