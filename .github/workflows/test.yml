name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency security audit
        run: pnpm audit --audit-level=moderate
      - run: pnpm typecheck
      - run: pnpm typecheck:api
      - name: Unit and hardening regression suite
        env:
          CHIRPY_TEST_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: pnpm test
      - run: pnpm rollout:proof
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  gate-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned gate image
        run: docker build -f selfhost/gate.Dockerfile -t chirpy-gate-hardening:test .
      - name: Validate Compose configuration
        run: |
          cp selfhost/gate.env.example selfhost/gate.env
          docker compose -f selfhost/docker-compose.yml config --no-env-resolution --quiet
      - name: Verify restricted runtime and persistence
        run: node scripts/test-gate-container.mjs chirpy-gate-hardening:test
      - name: Scan the shipped image for high and critical vulnerabilities
        run: |
          docker save chirpy-gate-hardening:test -o /tmp/chirpy-gate-image.tar
          docker run --rm -v /tmp/chirpy-gate-image.tar:/scan/image.tar:ro aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress

  native-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: audit-tool
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.audit-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the native lockfile
        run: cargo audit --file apps/web/src-tauri/Cargo.lock --json > native-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-dependency-audit
          path: native-audit.json
