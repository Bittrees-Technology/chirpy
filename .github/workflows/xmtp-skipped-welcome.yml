name: xmtp-skipped-welcome

on:
  workflow_dispatch:
  push:
    branches: [fix/skipped-welcome-recovery]

permissions:
  contents: read

jobs:
  existing-publication-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Recover the same dev publication after the old browser skipped it
        run: node scripts/test-mail-browser-upgrade.mjs --dev
        env:
          CHIRPY_TEST_NATIVE_CSP: '1'
          CHAT_TEST_SKIPPED_WELCOME: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skipped-welcome-recovery-evidence
          path: test-results/
