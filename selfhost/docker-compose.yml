# Self-hosted Chirpy gate. The `gate` service runs the XMTP gatekeeper room-join handler
# (selfhost/gate-server.mjs) in an always-on container that supports
# @xmtp/node-sdk's native bindings. The web endpoint does not host a gatekeeper.
#
# Point an org's OrgConfig.gateUrl at  http(s)://<your-host>/api/room-join
services:
  gate:
    build:
      context: ..
      dockerfile: selfhost/gate.Dockerfile
    env_file: ./gate.env
    ports:
      - "${GATE_PORT:-8788}:8788"
    restart: unless-stopped
    # Persist the XMTP MLS store (GATE_DATA_DIR=/data in the image) so the gatekeeper reuses
    # its existing XMTP installation across restarts instead of registering a new one each boot.
    volumes:
      - gate-data:/data

volumes:
  gate-data:
